      axisLabel: { color: inkDim, fontSize: 11, fontWeight: 600, fontFamily: 'JetBrains Mono, monospace' },
      axisTick: { show: false },
      splitLine: { show: false },
    };
  }

  // ── Chart 1: limit-up/down bars + sector avg-pct line ───────────────
  const chart1 = echarts.init(document.getElementById('chart-limits'), null, { renderer: 'svg' });
  chart1.setOption({
    backgroundColor: 'transparent',
    grid: { left: 50, right: 50, top: 50, bottom: 60 },
    tooltip: {
      trigger: 'axis',
      backgroundColor: bg,
      borderColor: ruleGold,
      borderWidth: 1,
      textStyle: { color: ink, fontFamily: 'Inter', fontWeight: 700 },
      axisPointer: { type: 'cross', lineStyle: { color: goldSft } },
    },
    legend: {
      data: ['漲停家數', '跌停家數', '全族群平均漲幅'],
      textStyle: { color: ink, fontFamily: 'Inter', fontWeight: 700 },
      top: 8,
      itemGap: 28,
    },
    xAxis: commonAxis(),
    yAxis: [
      {
        type: 'value',
        name: '家數',
        nameTextStyle: { color: inkDim, fontSize: 11, padding: [0, 0, 0, -10] },
        axisLine: { lineStyle: { color: rule } },
        axisLabel: { color: inkDim, fontSize: 11, fontWeight: 600 },
        splitLine: { lineStyle: { color: rule, type: 'dashed' } },
      },
      {
        type: 'value',
        name: '% 平均',
        nameTextStyle: { color: inkDim, fontSize: 11, padding: [0, -10, 0, 0] },
        axisLine: { lineStyle: { color: rule } },
        axisLabel: { color: inkDim, fontSize: 11, fontWeight: 600, formatter: '{value}%' },
        splitLine: { show: false },
      },
    ],
    dataZoom: [
      { type: 'inside', start: 0, end: 100 },
      {
        type: 'slider', height: 24, bottom: 8,
        borderColor: 'transparent',
        backgroundColor: 'transparent',
        fillerColor: 'rgba(138,101,11,0.18)',
        handleStyle: { color: gold },
        moveHandleStyle: { color: gold },
        textStyle: { color: inkDim, fontFamily: 'JetBrains Mono', fontSize: 10, fontWeight: 600 },
        dataBackground: {
          lineStyle: { color: goldSft },
          areaStyle: { color: 'rgba(138,101,11,0.14)' },
        },
      },
    ],
    series: [
      {
        name: '漲停家數',
        type: 'bar',
        stack: 'limit-up',
        data: MARKET_DATA.map(d => d.limit_up_twse + d.limit_up_tpex),
        itemStyle: { color: up },
        barMaxWidth: 12,
      },
      {
        name: '跌停家數',
        type: 'bar',
        stack: 'limit-down',
        data: MARKET_DATA.map(d => -(d.limit_down_twse + d.limit_down_tpex)),
        itemStyle: { color: down },
        barMaxWidth: 12,
      },
      {
        name: '全族群平均漲幅',
        type: 'line',
        yAxisIndex: 1,
        data: MARKET_DATA.map(d => d.sectors_avg_pct),
        smooth: true,
        lineStyle: { color: gold, width: 2.6 },
        itemStyle: { color: gold },
        symbolSize: 5,
        areaStyle: {
          color: {
            type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              { offset: 0, color: 'rgba(138,101,11,0.22)' },
              { offset: 1, color: 'rgba(138,101,11,0)' },
            ],
          },
        },
      },
    ],
  });

  // ── Chart 2: turnover + limit-up concentration ─────────────────────
  const chart2 = echarts.init(document.getElementById('chart-volume'), null, { renderer: 'svg' });
  chart2.setOption({
    backgroundColor: 'transparent',
    grid: { left: 60, right: 60, top: 50, bottom: 60 },
    tooltip: {
      trigger: 'axis',
      backgroundColor: bg,
      borderColor: ruleGold,
      borderWidth: 1,
      textStyle: { color: ink, fontFamily: 'Inter', fontWeight: 700 },
      axisPointer: { type: 'cross', lineStyle: { color: goldSft } },
    },
    legend: {
      data: ['總成交額(億)', '漲停集中度(%)'],
      textStyle: { color: ink, fontWeight: 700 },
      top: 8,
      itemGap: 28,
    },
    xAxis: commonAxis(),
    yAxis: [
      {
        type: 'value', name: '億 NT$',
        nameTextStyle: { color: inkDim, fontSize: 11 },
        axisLine: { lineStyle: { color: rule } },
        axisLabel: { color: inkDim, fontSize: 11, fontWeight: 600 },
        splitLine: { lineStyle: { color: rule, type: 'dashed' } },
      },
      {
        type: 'value', name: '%',
        nameTextStyle: { color: inkDim, fontSize: 11 },
        axisLine: { lineStyle: { color: rule } },
        axisLabel: { color: inkDim, fontSize: 11, fontWeight: 600, formatter: '{value}%' },
        splitLine: { show: false },
        max: 50,
      },
    ],
    dataZoom: [
      { type: 'inside', start: 0, end: 100 },
      {
        type: 'slider', height: 24, bottom: 8,
        borderColor: 'transparent', backgroundColor: 'transparent',
        fillerColor: 'rgba(138,101,11,0.18)',
        handleStyle: { color: gold }, moveHandleStyle: { color: gold },
        textStyle: { color: inkDim, fontFamily: 'JetBrains Mono', fontSize: 10, fontWeight: 600 },
        dataBackground: {
          lineStyle: { color: goldSft },
          areaStyle: { color: 'rgba(138,101,11,0.14)' },
        },
      },
    ],
    series: [
      {
        name: '總成交額(億)',
        type: 'bar',
        data: MARKET_DATA.map(d => d.turnover_billion),
        itemStyle: { color: 'rgba(168,116,9,0.68)' },
        barMaxWidth: 12,
      },
      {
        name: '漲停集中度(%)',
        type: 'line',
        yAxisIndex: 1,
        data: MARKET_DATA.map(d => d.up_concentration_pct),
        smooth: true,
        lineStyle: { color: up, width: 2.6 },
        itemStyle: { color: up },
        symbolSize: 5,
      },
    ],
  });

  // Re-fit charts on resize / orientation change
  function resizeAll() { chart1.resize(); chart2.resize(); }
  window.addEventListener('resize', resizeAll);
  </script>
</body>
</html>
